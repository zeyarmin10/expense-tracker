// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            // @capacitor/filesystem and @capacitor/camera are compiled against
            // Kotlin 2.2.20 and use runtime helpers (e.g. SpillingKt for
            // coroutine state) that don't exist in older stdlib releases —
            // forcing 1.8.22 here (a leftover from before those plugins were
            // added) caused a NoClassDefFoundError crash the moment a
            // suspend function in FilesystemPlugin resumed. Pin to the same
            // version those plugins already expect instead of an old one.
            force "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

