<div
  #overlay
  class="lb-overlay"
  [class.lb-open]="visible"
  [class.lb-has-footer]="hasFooter"
  role="dialog"
  aria-modal="true"
  (click)="onOverlayClick($event)"
>

  <!-- Top bar -->
  <div class="lb-topbar">
    <span class="lb-counter" *ngIf="images.length > 1">
      {{ formatService.formatCount(idx + 1) }}<span class="lb-counter-sep">/</span>{{ formatService.formatCount(images.length) }}
    </span>
    <span *ngIf="images.length <= 1"></span>

    <div class="lb-topbar-actions">
      <!-- A plain <a download> is ignored for cross-origin (Cloudinary) URLs,
           which opened a new tab — or the external browser in the app. -->
      <button
        type="button"
        class="lb-action-btn"
        [disabled]="isDownloading"
        [attr.aria-label]="'DOWNLOAD_BUTTON_LABEL' | translate"
        (click)="download(); $event.stopPropagation()"
      >
        <span *ngIf="isDownloading" class="lb-btn-spinner" aria-hidden="true"></span>
        <svg *ngIf="!isDownloading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="lb-action-btn lb-close-btn" (click)="hide()" [attr.aria-label]="'CLOSE_BUTTON_LABEL' | translate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Image stage -->
  <div
    #vp
    class="lb-stage"
    (touchstart)="onStart($event)"
    (touchend)="onEnd($event)"
    (touchcancel)="onEnd($event)"
    (mousedown)="onMouseDown($event)"
    (click)="onStageClick()"
  >
    <div #imgWrap class="lb-img-wrap" [class.lb-img-fade]="fading" [class.lb-img-wrap-shaped]="!!shapeBorderRadius"
      (click)="$event.stopPropagation()" (dblclick)="onDoubleClick($event)">
      <img
        #img
        class="lb-img"
        [class.lb-img-shaped]="!!shapeBorderRadius"
        [class.lb-img-pending]="isPending || hasError"
        [style.border-radius]="shapeBorderRadius"
        [src]="images[idx]"
        alt=""
        draggable="false"
        (load)="onImgSettled($event)"
        (error)="onImgSettled($event)"
      />
    </div>

    <!-- Shown while the current image is still loading -->
    <div class="lb-spinner" *ngIf="visible && isPending" aria-hidden="true"></div>

    <!-- The current image failed to load -->
    <div class="lb-error" *ngIf="visible && hasError" role="alert" (click)="$event.stopPropagation()">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><line x1="13.5" x2="6" y1="13.5" y2="21"/><line x1="18" x2="21" y1="12" y2="15"/><path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.052-.22 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/></svg>
      <p class="lb-error-title">{{ 'IMAGE_LOAD_ERROR' | translate }}</p>
      <p class="lb-error-hint">{{ 'IMAGE_LOAD_ERROR_HINT' | translate }}</p>
      <button type="button" class="lb-error-retry" (click)="$event.stopPropagation(); retryImage()">{{ 'WEB_RETRY_CONNECTION' | translate }}</button>
    </div>

    <!-- Zoom badge (shown/updated imperatively from TS — see applyZoomBadge) -->
    <div #zoomBadge class="lb-zoom-badge"></div>
  </div>

  <!-- Prev / Next -->
  <button *ngIf="images.length > 1 && idx > 0"     class="lb-nav lb-prev" (click)="prev()" [attr.aria-label]="'PREVIOUS_BUTTON_LABEL' | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button *ngIf="images.length > 1 && idx < images.length - 1" class="lb-nav lb-next" (click)="next()" [attr.aria-label]="'NEXT_BUTTON_LABEL' | translate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <!-- Host-provided caption/actions (footer mode only) -->
  <ng-content select="[lbFooter]"></ng-content>

  <!-- Thumbnail filmstrip -->
  <div class="lb-filmstrip" *ngIf="images.length > 1 && !hasFooter">
    <div #filmstrip class="lb-filmstrip-inner">
      <button
        class="lb-thumb"
        *ngFor="let img of images; let i = index; trackBy: trackByIndex"
        [class.lb-thumb-active]="i === idx"
        (click)="goTo(i); $event.stopPropagation()"
      >
        <img [src]="img" alt="" draggable="false" />
      </button>
    </div>
  </div>

  <!-- Hint -->
  <ng-container *ngIf="!hasFooter">
    <div class="lb-hint" *ngIf="images.length > 1">swipe · double-tap to zoom</div>
    <div class="lb-hint" *ngIf="images.length <= 1">double-tap to zoom</div>
  </ng-container>

</div>
